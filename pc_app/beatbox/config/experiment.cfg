# configspec for the main section
n_trials = 2
inter_trial_interval = 1000

[S2]
corrective_loop_timeout = 5000
error_flash_ms = 2000
learning_threshold = 0.1
# patterns to display for correct side and incorrect side
correct_pattern = 'w'
incorrect_pattern = 'b'
# only 'l' or 'r' to designate the correct side
screen_sequence = ['l', 'r', 'l', 'l', 'r', 'r']
# advanced configuration for pattern displaying and selection
advanced = True
# w: white, b: black, v: vertical lines, h:horizontal lines
left_screen_sequence = ['w', 'b', 'b']
right_screen_sequence = ['b', 'w', 'w']


[S3]
advanced = True
left_screen_sequence = ['w', 'w', 'w', 'b', 'b', 'w', 'b']
right_screen_sequence = ['b', 'w', 'b', 'b', 'w', 'b', 'w']
