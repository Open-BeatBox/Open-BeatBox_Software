# configspec for the main section
n_trials = 5
inter_trial_interval = 1000

[S2]
n_trials = 5
corrective_loop_timeout = 2000
error_flash_ms = 2000
learning_threshold = 0.1
# patterns to display for correct side and incorrect side
correct_pattern = 'w'
incorrect_pattern = 'w'
# only 'l' or 'r' to designate the correct side
screen_sequence = ['l', 'r', 'l', 'l', 'r', 'r']
# advanced configuration for pattern displaying and selection
advanced = False
# w: white, b: black, v: vertical lines, h:horizontal lines
# correct_pattern is used to determine which screen is the correct one
# sequence lengths can be different
# WARNING:
# no check is done to ensure that there is at least one correct pattern in each trial
left_screen_sequence = ['v', 'w', 'v']
right_screen_sequence = ['h', 'v', 'b']


# FIXME: use ConfigObjects inheritance to avoid code duplication
# IMPORTANT: you MUST copy all parameters from S2 even if they are not changed
[S3]
n_trials = 5
inter_trial_interval = 2000
corrective_loop_timeout = 2000
error_flash_ms = 1000
learning_threshold = 0.1
correct_pattern = 'h'
incorrect_pattern = 'v'
screen_sequence = ['l', 'r', 'l', 'l', 'r', 'r']
advanced = True
left_screen_sequence = ['h', 'h', 'w', 'b', 'h', 'h', 'h']
right_screen_sequence = ['b', 'v', 'h', 'h', 'v', 'v', 'h']
