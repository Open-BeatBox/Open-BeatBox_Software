## Pins configuration for the BeatBox system.
## This file defines the mapping of sensors and actuators to their respective pins on the microcontroller.
## Note: the default values needs to be the same as defined in the firmware.
## FIXME: this leads to code duplication and potential inconsistencies/side effects.

[sensors]
    nose_poke             = 41
    left_response         = 2
    right_response        = 3
    left_tunnel_crossing  = 63  # A9 in firmware
    right_tunnel_crossing = 36   # A10 in firmware
    feed_alert            = 40

[actuators]
    reward                        = {'pin': 22, 'default': 0}
    left_pattern_bit_0            = {'pin': 23, 'default': 0}
    left_pattern_bit_1            = {'pin': 24, 'default': 0}
    left_pattern_bit_2            = {'pin': 25, 'default': 0}
    left_pattern_bit_3            = {'pin': 26, 'default': 0}
    right_pattern_bit_0           = {'pin': 27, 'default': 0}
    right_pattern_bit_1           = {'pin': 28, 'default': 0}
    right_pattern_bit_2           = {'pin': 29, 'default': 0}
    right_pattern_bit_3           = {'pin': 30, 'default': 0}
    light                         = {'pin': 31, 'default': 0}
    red_light                     = {'pin': 32, 'default': 0}
